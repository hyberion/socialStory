# Local development.
#   Database only (usual):   pnpm db:up      then run the apps with pnpm dev
#   Full stack in Docker:    docker compose --profile full up --build
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-socialstory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-socialstory}
      POSTGRES_DB: ${POSTGRES_DB:-socialstory}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-socialstory}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-socialstory}:${POSTGRES_PASSWORD:-socialstory}@postgres:5432/${POSTGRES_DB:-socialstory}
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
